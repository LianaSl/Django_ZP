{% extends "base.html" %}
{% load static %}

{% block main_content %}
<link rel="stylesheet" href="{% static 'shop/css/cart.css' %}">

<section class="cart-section">
<div class="cart-page">
    <div class="cart-box">
        <div class="product-layout">

            <div class="product-photo">
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}">
                {% endif %}
            </div>

            <div class="product-info">
                <h1 class="product-name">{{ product.name }}</h1>
                <p class="product-description">{{ product.description }}</p>
                <p class="product-price"><strong>{{ product.price|floatformat:"-2" }} Kč</strong></p>
                <p>Skladem: {{ product.quantity }} ks</p>

                <form action="{% url 'cart_product' id=product.id %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn-send">Do košíku</button>
                </form>

                <p><a href="{% url 'products_page' %}">← Zpět do katalogu</a></p>
            </div>

        </div>
    </div>
</div>
</section>
{% endblock main_content %}
