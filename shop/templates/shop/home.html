{% extends "base.html" %}
{% block main_content %}
    <ul class="Products_list">
        {% if prod %}
            <li class="product-item">
                <h1>{{ prod.title }}</h1>
                <p>{{ prod.description }}</p>
                <span>{{ prod.price }} CZK </span>
                <span>{{ prod.quantity }} шт.</span>
            </li>
            {% else %}
                <p>Product not found</p>
            {% endif %}
</ul>
{% endblock main_content %}
