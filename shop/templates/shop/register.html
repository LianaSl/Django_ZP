{% extends "base.html" %}
{% load static %}

{% block main_content %}
<link rel="stylesheet" href="{% static 'shop/css/login.css' %}">

<section class="invite">
    <div class="invite-card">
        <h1>Registrace</h1>
        <p>Vytvořte si účet a objednávejte v „FLORENTINA“.</p>

        <form method="post">
            {% csrf_token %}
            {{ form }}
            <button type="submit">Registrace</button>
        </form>

        <p class="invite-link">
            Už máte účet? <a href="{% url 'login' %}">Přihlaste se</a>
        </p>
    </div>
</section>

{% endblock main_content %}
