{% load static %}
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
    {% block css %}{% endblock %}
    <title>Liana Šljonkina — Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <ul>
                <li><a href="{% url 'home_page' %}">Hlavní</a></li>
                <li><a href="{% url 'products_page' %}">Katalog</a></li>
                <li>
                    {% if user.is_authenticated %}
                        <form action="{% url 'logout' %}" method="post" class="logout-form">
                            {% csrf_token %}
                            <button type="submit" class="logout-btn">Odhlásit se</button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}">Přihlášení</a>
                    {% endif %}
                </li>
                <li><a href="{% url 'cart' %}">Košík</a></li>
                <li><a href="{% url 'contacts_page' %}">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    {% block main_content %}
    {% endblock main_content %}

    <footer class="footer">
        <div>© created by <a href="mailto:sljonkina@gmail.com">Liana Šljonkina</a></div>
    </footer>
</body>
</html>
